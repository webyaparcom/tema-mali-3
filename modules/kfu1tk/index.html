  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-fuar-geri-sayim :is(.modulex-fuar-geri-sayim-baslik, .modulex-fuar-geri-sayim-ust, h3, h4, strong) { letter-spacing: 0; }

  @media (prefers-reduced-motion: reduce) {
    .modulex-fuar-geri-sayim *, .modulex-fuar-geri-sayim *::before, .modulex-fuar-geri-sayim *::after { animation: none !important; transition: none !important; }
  }
</style>
<script>
  (() => {
    const P = "modulex-fuar-geri-sayim";
    const az = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
    const geriSayim = (s, P) => {
        const k = s.querySelector("[data-zaman]");
        if (!k) return;
        const hedef = Date.parse(k.dataset.zaman);
        if (!Number.isFinite(hedef)) return;
        const dl = document.documentElement.lang || undefined;
        let f;
        try { f = new Intl.NumberFormat(dl, { minimumIntegerDigits: 2, useGrouping: false }); } catch (x) { f = { format: (n) => String(n).padStart(2, "0") }; }
        const el = {};
        k.querySelectorAll("[data-birim]").forEach((e) => { el[e.dataset.birim] = e; });
        const bitti = s.querySelector("[data-bitti]");
        const son = () => { k.hidden = true; if (bitti) bitti.hidden = false; s.classList.add(P + "--bitti"); };
        if (hedef <= Date.now()) { son(); return; }
        let t = 0;
        const yaz = () => {
          const kalan = Math.max(0, hedef - Date.now());
          const sn = Math.floor(kalan / 1000);
          const d = { g: Math.floor(sn / 86400), s: Math.floor((sn % 86400) / 3600), d: Math.floor((sn % 3600) / 60), n: sn % 60 };
          Object.keys(d).forEach((x) => {
            const e = el[x];
            if (!e) return;
            const v = f.format(d[x]);
            if (e.textContent === v) return;
            e.textContent = v;
            e.classList.remove(P + "--tik");
            void e.offsetWidth;
            e.classList.add(P + "--tik");
          });
          if (!kalan) { clearInterval(t); son(); }
        };
        k.hidden = false;
        yaz();
        t = setInterval(yaz, 1000);
      };
    document.querySelectorAll("." + P).forEach((s) => {
      if (s.dataset.fbHazir) return;
      s.dataset.fbHazir = "1";
      geriSayim(s, P, az);
    });
  })();
</script>
