<section class="modulex-sayac-terazi{{fbsinif}}" {{fbetiket}}>
  <div class="modulex-sayac-terazi-ic">
    {{fbbas}}
    {{fbgovde}}
  </div>
</section>

<style>
  /* sayac-terazi — sayac-gosterge (yarım yay) ve sayac-halka (dairesel dolum) oranı dolumla anlatır; bu modül oranı fiziksel denge/eğimle anlatır — direk + kol + iki asılı kefe iskeleti (hukuk «kazanılan dava» dili). */
  .modulex-sayac-terazi { box-sizing: border-box; width: 100%; padding: --bosluk-- 20px; background: --bg--; color: --text--; font-size: 1rem; line-height: 1.6; font-family: var(--mx-font-sans, inherit); overflow-wrap: break-word; }
  .modulex-sayac-terazi *, .modulex-sayac-terazi *::before, .modulex-sayac-terazi *::after { box-sizing: border-box; }
  /* ham/css.css «* { font-size: 14px }» kalıtımı keser — modül içinde boyut üstten gelsin (ikon yazı tipi hariç) */
  .modulex-sayac-terazi :where(*:not(.material-symbols-outlined)) { font-size: inherit; }
  /* aynı «*» kuralı font-weight 400 · line-height 1.2 · font-family de basar — modül içinde kalıtım */
  .modulex-sayac-terazi :where(*:not(.material-symbols-outlined)) { font-weight: inherit; line-height: inherit; font-family: inherit; }
  .modulex-sayac-terazi :where(h2, h3, h4, p, ul, ol, li, figure, blockquote, dl, dd) { margin: 0; }
  .modulex-sayac-terazi :where(ul, ol) { padding: 0; list-style: none; }
  .modulex-sayac-terazi img { display: block; max-width: 100%; }
  /* <img width height> öznitelik yüksekliği CSS aspect-ratio'yu ezer — sıfır özgüllükle auto (modül sınıfının height'ı yine kazanır) */
  :where(.modulex-sayac-terazi) img { height: auto; }
  .modulex-sayac-terazi [hidden] { display: none !important; }
  .modulex-sayac-terazi :where(a, button, summary, [data-cevir]) { cursor: pointer; }
  .modulex-sayac-terazi :where(a, button, summary, [tabindex]):focus-visible { outline: 3px solid --accent--; outline-offset: 3px; }
  .modulex-sayac-terazi-ic { max-width: --max--; margin-inline: auto; }
  .modulex-sayac-terazi-bas { display: grid; gap: 12px; margin-block-end: clamp(32px, 4vw, 52px); }
  .modulex-sayac-terazi--bassiz .modulex-sayac-terazi-bas { display: none; }
  .modulex-sayac-terazi-ust { color: --accentInk--; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; }
  .modulex-sayac-terazi-baslik { font-family: var(--mx-font-heading, inherit); font-size: clamp(1.8rem, 3.4vw, 2.8rem); font-weight: 750; letter-spacing: -0.025em; line-height: 1.1; }
  .modulex-sayac-terazi-metin { color: --muted--; font-size: 1.05rem; line-height: 1.7; }
  .modulex-sayac-terazi-bas { max-width: 780px; margin-inline: auto; text-align: center; justify-items: center; }
  .modulex-sayac-terazi-cta { display: flex; flex-wrap: wrap; gap: 12px; margin-block-start: 8px; }
  .modulex-sayac-terazi-dugme { display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 12px 22px; border: 2px solid --accent--; border-radius: 999px; background: --accent--; color: --accentText--; font-weight: 700; text-decoration: none; transition: transform 0.25s ease, background 0.25s ease, color 0.25s ease; }
  .modulex-sayac-terazi-dugme:hover { transform: translateY(-2px); }
  .modulex-sayac-terazi-dugme--ikincil { background: transparent; color: --text--; border-color: --cizgi--; }
  .modulex-sayac-terazi-dugme--ikincil:hover { border-color: --accent--; }
  .modulex-sayac-terazi-dugme .material-symbols-outlined { font-size: 20px; }

  .modulex-sayac-terazi-liste { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); gap: 56px 32px; }
  .modulex-sayac-terazi-oge { --r: calc(var(--egim) * var(--yon, 1)); display: grid; justify-items: center; align-content: start; gap: 10px; text-align: center; }
  [dir="rtl"] .modulex-sayac-terazi-oge { --yon: -1; }
  .modulex-sayac-terazi-terazi { position: relative; width: min(100%, 220px); height: 168px; margin-block-end: 6px; }
  .modulex-sayac-terazi-direk { position: absolute; inset-block: 26px 12px; inset-inline-start: calc(50% - 2px); width: 4px; border-radius: 2px; background: --text--; }
  .modulex-sayac-terazi-taban { position: absolute; inset-block-end: 0; inset-inline: 32%; height: 12px; border-radius: 10px 10px 3px 3px; background: --text--; }
  .modulex-sayac-terazi-tepe { position: absolute; inset-block-start: 16px; inset-inline-start: calc(50% - 9px); width: 18px; height: 18px; border-radius: 50%; background: --accent--; box-shadow: 0 0 0 4px --bg--; transition: background 0.3s ease; }
  .modulex-sayac-terazi-kol { position: absolute; inset-block-start: 23px; inset-inline: 16%; height: 4px; border-radius: 2px; background: --text--; transform: rotate(var(--r)); transition: transform 1.6s cubic-bezier(0.34, 1.56, 0.64, 1); }
  .modulex-sayac-terazi-kefe { position: absolute; inset-block-start: 2px; width: 70px; transform: rotate(calc(var(--r) * -1)); transform-origin: 50% 0; transition: transform 1.6s cubic-bezier(0.34, 1.56, 0.64, 1); }
  .modulex-sayac-terazi-kefe--a { inset-inline-start: -35px; }
  .modulex-sayac-terazi-kefe--b { inset-inline-end: -35px; }
  .modulex-sayac-terazi-kefe svg { display: block; width: 100%; height: auto; overflow: visible; }
  .modulex-sayac-terazi-ip { fill: none; stroke: --muted--; stroke-width: 1.5; }
  .modulex-sayac-terazi-tas { fill: --cizgi--; stroke: --muted--; stroke-width: 1.5; transition: fill 0.3s ease; }
  .modulex-sayac-terazi-kefe--a .modulex-sayac-terazi-tas { fill: --accent--; stroke: --accent--; }
  .modulex-sayac-terazi--hazir:not(.modulex-sayac-terazi--gor) .modulex-sayac-terazi-kol, .modulex-sayac-terazi--hazir:not(.modulex-sayac-terazi--gor) .modulex-sayac-terazi-kefe { transform: none; }
  .modulex-sayac-terazi-oge:hover .modulex-sayac-terazi-tepe { background: --text--; }
  .modulex-sayac-terazi-oge:hover .modulex-sayac-terazi-kefe--b .modulex-sayac-terazi-tas { fill: color-mix(in srgb, --accent-- 30%, transparent); }
  .modulex-sayac-terazi-sayi { font-family: var(--mx-font-heading, Georgia, serif); font-size: clamp(2.2rem, 4vw, 3.1rem); font-weight: 600; font-variant-numeric: tabular-nums lining-nums; letter-spacing: -0.02em; line-height: 1; }
  .modulex-sayac-terazi-ek { color: --accentInk--; font-size: 0.6em; }
  .modulex-sayac-terazi-etiket { display: inline-flex; align-items: center; gap: 6px; font-size: 0.84rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; }
  .modulex-sayac-terazi-ikon { color: --accentInk--; font-size: 18px; }
  .modulex-sayac-terazi-not { max-width: 28ch; color: --muted--; font-size: 0.92rem; }
  @media (max-width: 768px) {
    .modulex-sayac-terazi-liste { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 40px 14px; }
    .modulex-sayac-terazi-terazi { height: 128px; }
    .modulex-sayac-terazi-kefe { width: 50px; }
    .modulex-sayac-terazi-kefe--a { inset-inline-start: -25px; }
    .modulex-sayac-terazi-kefe--b { inset-inline-end: -25px; }
    .modulex-sayac-terazi-etiket { letter-spacing: 0.06em; }
  }

  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-sayac-terazi :is(.modulex-sayac-terazi-baslik, .modulex-sayac-terazi-ust, h3, h4, strong) { letter-spacing: 0; }
  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-sayac-terazi-baslik { line-height: 1.35; }
  @media (max-width: 768px) {
    .modulex-sayac-terazi { padding-inline: 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .modulex-sayac-terazi *, .modulex-sayac-terazi *::before, .modulex-sayac-terazi *::after { animation: none !important; transition: none !important; }
  }
</style>
<script>
  (() => {
    const P = "modulex-sayac-terazi";
    const az = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
    const gozlem = (s, P, az) => {
        const gor = () => s.classList.add(P + "--gor");
        s.classList.add(P + "--hazir");
        if (az || !("IntersectionObserver" in window)) { gor(); return; }
        const io = new IntersectionObserver((gs) => {
          gs.forEach((g) => { if (g.isIntersecting) { gor(); io.disconnect(); } });
        }, { threshold: 0.15 });
        io.observe(s);
      };
    const sayac = (s, P, az) => {
        const el = [...s.querySelectorAll("[data-hedef]")];
        if (!el.length || az || !("IntersectionObserver" in window)) return;
        const dl = document.documentElement.lang || undefined;
        const oynat = () => el.forEach((e) => {
          const h = Number(e.dataset.hedef);
          const od = Number(e.dataset.ondalik) || 0;
          const son = e.textContent;
          if (!Number.isFinite(h)) return;
          let f;
          try { f = new Intl.NumberFormat(dl, { minimumFractionDigits: od, maximumFractionDigits: od }); } catch (x) { return; }
          const t0 = performance.now();
          const adim = (t) => {
            const p = Math.min(1, (t - t0) / 1300);
            e.textContent = p < 1 ? f.format(h * (1 - Math.pow(1 - p, 3))) : son;
            if (p < 1) requestAnimationFrame(adim);
          };
          requestAnimationFrame(adim);
        });
        const io = new IntersectionObserver((gs) => {
          gs.forEach((g) => { if (g.isIntersecting) { oynat(); io.disconnect(); } });
        }, { threshold: 0.3 });
        io.observe(s);
      };
    document.querySelectorAll("." + P).forEach((s) => {
      if (s.dataset.fbHazir) return;
      s.dataset.fbHazir = "1";
      gozlem(s, P, az);
      sayac(s, P, az);
    });
  })();
</script>
